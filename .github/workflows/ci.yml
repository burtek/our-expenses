name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Get latest tags
        run: git fetch --tags

      - name: Calculate version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BASE_MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          BASE_MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)

          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v pr | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            VERSION="$BASE_VERSION"
          else
            LATEST_VERSION=${LATEST_TAG#v}

            LATEST_MAJOR=$(echo "$LATEST_VERSION" | cut -d. -f1)
            LATEST_MINOR=$(echo "$LATEST_VERSION" | cut -d. -f2)
            LATEST_PATCH=$(echo "$LATEST_VERSION" | cut -d. -f3)

            if [ "$BASE_MAJOR" != "$LATEST_MAJOR" ] || [ "$BASE_MINOR" != "$LATEST_MINOR" ]; then
              VERSION="$BASE_VERSION"
            else
              PATCH=$((LATEST_PATCH + 1))
              VERSION="$BASE_MAJOR.$BASE_MINOR.$PATCH"
            fi
          fi

          if [ -n "$PR_NUMBER" ]; then
            VERSION="${VERSION}-pr.${PR_NUMBER}-${BUILD_NUMBER}"
          fi

          echo "VERSION=$VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/our-expenses-release.jks

      - name: Create Android signing properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../our-expenses-release.jks
          EOF

      - name: Build Android APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build apk \
            --release --split-per-abi \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: outputs
          retention-days: 1
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Clean up signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/our-expenses-release.jks

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write
    outputs:
      release_link: ${{ steps.release.outputs.release_link }}
      version: ${{ needs.build.outputs.version }}

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: outputs
          path: dist

      - id: release
        name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ needs.build.outputs.version }}
          LATEST_TAG: ${{ needs.build.outputs.latest_tag }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            NOTES="Automatic release built from commit ${{ github.event.pull_request.head.sha }} against ${{ github.event.pull_request.base.ref }}@${{ github.event.pull_request.base.sha }}"
          else
            NOTES="Automatic release built from commit ${{ github.sha }}"
          fi

          RELEASE_ARGS=(
            "$TAG_NAME"
            --target "${{ github.sha }}"
            --generate-notes
            --notes "$NOTES"
            --notes-start-tag "$LATEST_TAG"
            --repo "${{ github.repository }}"
          )

          if [[ "$TAG_NAME" == *-pr.* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${RELEASE_ARGS[@]}" dist/app-*-release.apk

          RELEASE_URL=$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json url -q .url)
          echo "release_link=$RELEASE_URL" >> "$GITHUB_OUTPUT"

  pr-comment:
    if: github.event_name == 'pull_request'
    needs: release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Comment artifact link
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG_NAME: v${{ needs.release.outputs.version }}
          LINK: ${{ needs.release.outputs.release_link }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "📦 [Release $TAG_NAME artifacts]($LINK) - built from commit $COMMIT_SHA against `$BASE_REF` @ $BASE_SHA"
