name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib/ test/

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - id: name
        name: Get name
        run: echo "name=expense-settler-android-${{ case(github.event_name == 'push', 'release', 'pr-preview') }}.apk" >> "$GITHUB_OUTPUT"

      - name: Copy file
        run: cp build/app/outputs/flutter-apk/app-release.apk ${{ steps.name.outputs.name }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          archive: false
          retention-days: case(github.event_name == 'push', 5, 1)
          path: ${{ steps.name.outputs.name }}


  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: expense-settler-android-release.apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.sha }}
        run: |
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --generate-notes
            --notes "Automated release for commit ${{ github.sha }}" \
            dist/expense-settler-android-release.apk
